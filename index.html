<style>
:root{
  color-scheme:light;
  --bg:#eef3f6;--surface:#ffffff;--surface-2:#f6f9fb;--line:#d9e2e9;
  --text:#0f1c25;--muted:#5a6b78;--brand:#50c8f5;--brand-ink:#03131b;
  --focus:#1592c9;--ok:#15845a;--err:#c23a3a;--chip:#e7f6fd;--chip-line:#bfe7f8;
  --shadow:0 1px 2px #0f1c250d,0 8px 24px #0f1c250f;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1217;--surface:#141c23;--surface-2:#10171d;--line:#253139;
  --text:#e7eef3;--muted:#8d9fac;--focus:#6fd3f8;--ok:#5ccf9b;--err:#f07a7a;
  --chip:#13303d;--chip-line:#1f4a5c;--shadow:0 1px 2px #0006,0 10px 30px #0005;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1217;--surface:#141c23;--surface-2:#10171d;--line:#253139;
    --text:#e7eef3;--muted:#8d9fac;--focus:#6fd3f8;--ok:#5ccf9b;--err:#f07a7a;
    --chip:#13303d;--chip-line:#1f4a5c;--shadow:0 1px 2px #0006,0 10px 30px #0005;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.5;
  padding:40px 18px 32px;
}
main{width:min(680px,100%);margin:0 auto}

/* Header */
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{
  width:52px;height:52px;border-radius:12px;flex:none;display:block;
  image-rendering:auto;box-shadow:0 6px 16px #50c8f533;
}
.top-text{flex:1;min-width:0}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.2px}
.subtitle{margin:0;color:var(--muted);font-size:14px}
.theme-btn{
  flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer;font-size:17px;
  display:grid;place-items:center;transition:color .15s,border-color .15s;
}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}

/* List of lookups */
.board{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;
}
.lookup{padding:20px 22px;position:relative;transition:background .15s}
.lookup + .lookup{border-top:1px solid var(--line)}
.lookup:focus-within{background:var(--surface-2)}
.lookup:focus-within::before{
  content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand);
}
.lookup-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.title{display:flex;align-items:center;gap:10px}
.ico{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--chip);border:1px solid var(--chip-line);color:var(--focus);
}
.ico svg{width:18px;height:18px}
.lookup-head label{font-size:16px;font-weight:700;cursor:pointer}
kbd{
  font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface);
  direction:ltr;white-space:nowrap;
}
.entry{display:flex;gap:10px}
.field{position:relative;flex:1;min-width:0}
input{
  width:100%;height:46px;padding:0 14px 0 40px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.3px;
  direction:ltr;text-align:left;outline:none;transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:var(--muted);opacity:.75;letter-spacing:0;font-size:15px;direction:rtl;text-align:right}
input:placeholder-shown{direction:rtl;text-align:right;padding:0 14px}
input:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 18%,transparent)}
.clear{
  position:absolute;left:8px;top:50%;translate:0 -50%;width:26px;height:26px;border:0;
  border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;
  display:grid;place-items:center;
}
.clear:hover{background:var(--line);color:var(--text)}
input:placeholder-shown + .clear{display:none}
.go{
  flex:none;height:46px;min-width:128px;padding:0 18px;border:0;border-radius:10px;
  background:var(--brand);color:var(--brand-ink);font:inherit;font-size:15px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .15s,transform .1s;
}
.go:hover{filter:brightness(1.06)}
.go:active{transform:scale(.98)}
.go[aria-busy="true"]{pointer-events:none;filter:saturate(.6)}
.go svg{width:16px;height:16px}
:where(button,input,.chip):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:28px}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.recent:empty{display:none}
.chip{
  border:1px solid var(--chip-line);background:var(--chip);color:var(--text);
  font:inherit;font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:999px;
  padding:3px 10px;cursor:pointer;direction:ltr;transition:border-color .15s;
}
.chip:hover{border-color:var(--focus)}

.foot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  color:var(--muted);font-size:12.5px;margin-top:16px;padding:0 4px;
}
.link-btn{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--text)}

.report{
  width:100%;margin-top:14px;height:52px;border-radius:12px;cursor:pointer;
  border:0;background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow);
  font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:filter .15s,transform .1s;
}
.report:hover{filter:brightness(1.06)}
.report:active{transform:scale(.99)}
.report[aria-busy="true"]{pointer-events:none;opacity:.7}
.report svg{width:18px;height:18px}
.credit{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px;direction:ltr}
@media (max-width:540px){
  body{padding:24px 12px}
  .lookup{padding:16px}
  .entry{flex-direction:column}
  .go{width:100%}
  kbd{display:none}
  h1{font-size:21px}
  .logo{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="top-text">
      <h1>פתיחה מהירה ב‑Priority</h1>
    </div>
    <button class="theme-btn" type="button" id="themeBtn" aria-label="החלפת מצב תצוגה" title="החלפת מצב תצוגה">◐</button>
  </header>

  <div class="board">
    <section class="lookup" data-key="part" data-template='priority:priform#LOGPART:"{value}":a011003:tabula.ini'>
      <div class="lookup-head">
        <div class="title"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span><label for="in-part">כרטיס פריט</label></div>
        <kbd>Alt+1</kbd>
      </div>
      <form class="entry" novalidate>
        <div class="field">
          <input id="in-part" type="text" placeholder="מספר פריט" autocomplete="off" spellcheck="false" autofocus>
          <button class="clear" type="button" aria-label="ניקוי שדה" tabindex="-1">×</button>
        </div>
        <button class="go" type="submit">פתיחת פריט <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3h3v3M13 3 7 9M11 9v4H3V5h4"/></svg></button>
      </form>
      <div class="meta"><span class="status" aria-live="polite"></span><div class="recent" aria-label="פריטים אחרונים"></div></div>
    </section>

    <section class="lookup" data-key="porder" data-template='priority:priform#PORDERS:"{value}":a011003:tabula.ini'>
      <div class="lookup-head">
        <div class="title"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span><label for="in-porder">הזמנת רכש</label></div>
        <kbd>Alt+2</kbd>
      </div>
      <form class="entry" novalidate>
        <div class="field">
          <input id="in-porder" type="text" placeholder="מספר הזמנת רכש" autocomplete="off" spellcheck="false">
          <button class="clear" type="button" aria-label="ניקוי שדה" tabindex="-1">×</button>
        </div>
        <button class="go" type="submit">פתיחת הזמנה <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3h3v3M13 3 7 9M11 9v4H3V5h4"/></svg></button>
      </form>
      <div class="meta"><span class="status" aria-live="polite"></span><div class="recent" aria-label="הזמנות רכש אחרונות"></div></div>
    </section>

    <section class="lookup" data-key="order" data-template='priority:priform@ORDERS:"{value}":a011003:tabula.ini:1'>
      <div class="lookup-head">
        <div class="title"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6"/></svg></span><label for="in-order">הזמנת לקוח</label></div>
        <kbd>Alt+3</kbd>
      </div>
      <form class="entry" novalidate>
        <div class="field">
          <input id="in-order" type="text" placeholder="מספר הזמנת לקוח" autocomplete="off" spellcheck="false">
          <button class="clear" type="button" aria-label="ניקוי שדה" tabindex="-1">×</button>
        </div>
        <button class="go" type="submit">פתיחת הזמנה <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3h3v3M13 3 7 9M11 9v4H3V5h4"/></svg></button>
      </form>
      <div class="meta"><span class="status" aria-live="polite"></span><div class="recent" aria-label="הזמנות לקוח אחרונות"></div></div>
    </section>
  </div>

  <button class="report" type="button" id="reportBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="2.5" width="14" height="15" rx="2"/><path d="M7 7h6M7 10.5h6M7 14h3.5"/></svg>
    דוח מחיצות
  </button>

  <div class="foot">
    <span>Esc מנקה את השדה · לחיצה על מספר אחרון פותחת אותו שוב</span>
    <button class="link-btn" type="button" id="clearHistory">ניקוי היסטוריה</button>
  </div>

  <div class="credit">By Sharli Ofer</div>
</main>

<script>
(() => {
  const MAX_RECENT = 5;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k)    { try { localStorage.removeItem(k); } catch {} }
  };

  // Theme toggle: system → light → dark
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const applyTheme = t => { t ? root.setAttribute('data-theme', t) : root.removeAttribute('data-theme'); };
  applyTheme(store.get('pqa-theme', null));
  themeBtn.addEventListener('click', () => {
    const cur = root.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    applyTheme(next); store.set('pqa-theme', next);
  });

  const lookups = [...document.querySelectorAll('.lookup')];

  lookups.forEach(section => {
    const form = section.querySelector('form');
    const input = section.querySelector('input');
    const go = section.querySelector('.go');
    const clear = section.querySelector('.clear');
    const status = section.querySelector('.status');
    const recentBox = section.querySelector('.recent');
    const template = section.dataset.template;
    const key = 'pqa-recent-' + section.dataset.key;
    let timer;

    const setStatus = (text, kind = '') => {
      clearTimeout(timer);
      status.textContent = text;
      status.className = 'status' + (kind ? ' ' + kind : '');
      if (kind === 'ok') timer = setTimeout(() => setStatus(''), 3500);
    };

    const renderRecent = () => {
      recentBox.replaceChildren(...store.get(key, []).map(v => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = v;
        b.title = 'פתיחה מחדש';
        b.addEventListener('click', () => { input.value = v; launch(v); });
        return b;
      }));
    };

    const remember = v => {
      const list = store.get(key, []).filter(x => x !== v);
      list.unshift(v);
      store.set(key, list.slice(0, MAX_RECENT));
      renderRecent();
    };

    const launch = value => {
      input.removeAttribute('aria-invalid');
      go.setAttribute('aria-busy', 'true');
      setStatus('פותח ב‑Priority…');
      remember(value);
      // The protocol link is opened directly and never shown on screen.
      window.location.href = template.replace('{value}', value);
      setTimeout(() => {
        go.removeAttribute('aria-busy');
        setStatus('נשלח ל‑Priority: ' + value, 'ok');
        input.value = '';
        input.focus();
      }, 600);
    };

    form.addEventListener('submit', e => {
      e.preventDefault();
      const value = input.value.replace(/["']/g, '').trim();
      if (!value) {
        input.setAttribute('aria-invalid', 'true');
        setStatus('הקלידו מספר כדי לפתוח.', 'err');
        input.focus();
        return;
      }
      input.value = value;
      launch(value);
    });

    input.addEventListener('input', () => {
      input.removeAttribute('aria-invalid');
      if (status.classList.contains('err')) setStatus('');
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { input.value = ''; input.removeAttribute('aria-invalid'); setStatus(''); }
    });
    clear.addEventListener('click', () => { input.value = ''; setStatus(''); input.focus(); });

    renderRecent();
  });

  // Alt+1 / Alt+2 / Alt+3 jump to a field
  document.addEventListener('keydown', e => {
    if (!e.altKey) return;
    const n = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (n === undefined) return;
    e.preventDefault();
    const inp = lookups[n].querySelector('input');
    inp.focus(); inp.select();
  });

  // Report button: opens a fixed Priority link (not shown on screen)
  const reportBtn = document.getElementById('reportBtn');
  reportBtn.addEventListener('click', () => {
    reportBtn.setAttribute('aria-busy', 'true');
    window.location.href = 'priority:priform@STRN_DOOR_WORKPLAN.P::.:tabula.ini:1';
    setTimeout(() => reportBtn.removeAttribute('aria-busy'), 800);
  });

  document.getElementById('clearHistory').addEventListener('click', () => {
    lookups.forEach(s => {
      store.del('pqa-recent-' + s.dataset.key);
      s.querySelector('.recent').replaceChildren();
    });
  });
})();
</script>
</body>
